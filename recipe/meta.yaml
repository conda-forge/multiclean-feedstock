{% set name = "multiclean" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/multiclean-{{ version }}.tar.gz
  sha256: 64f88200e28cd257da721256ea5b8a99f66fd7d42c20d5a04ae5b7ae80416b57

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=68
    - setuptools-scm >=8
    - pip
  run:
    - python >={{ python_min }}
    - py-opencv >=4.10
    - numpy >=1.21

test:
  imports:
    - multiclean
  commands:
    - pip check
    # Guards against setuptools-scm being absent from `host:`, which makes the
    # build silently produce version 0.0.0 rather than failing.
    - python -c "import multiclean; assert multiclean.__version__ == '{{ version }}', multiclean.__version__"
  requires:
    - pip
    - python {{ python_min }}
    - libopencv * =*headless*  # [linux]

about:
  home: https://github.com/DPIRD-DMA/MultiClean
  description: Python library for morphological cleaning of multiclass 2D numpy arrays (edge smoothing and island removal)
  summary: Python library for morphological cleaning of multiclass 2D numpy arrays (edge smoothing and island removal)
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - wrignj08
    - giswqs
